name: Setup ROCm and HIP Toolchain
description: >-
  Unofficial action to install AMD ROCm / HIP SDK on Linux and Windows
  runners, with hipcc on PATH. Not affiliated with AMD.
author: vhrabar
branding:
  icon: cpu
  color: red

inputs:
  version:
    description: >-
      ROCm version to install, for example 10.2.0. Required: there is no
      default, so a workflow never changes ROCm version on its own. Must be
      in the supported list.
    required: true
  gfx:
    description: >-
      GPU target(s), for example gfx1200. Comma-separated for several.
      Use `all` for all-architecture packages (very large).
    required: false
    default: all
  components:
    description: >-
      Linux 10.x only. Comma-separated: runtime, dev, sdk, developer-tools,
      opencl.
    required: false
    default: dev
  use-cache:
    description: Cache the downloaded installer or tarball where possible.
    required: false
    default: 'true'
  log-file-suffix:
    description: Suffix of the Windows installer log file name.
    required: false
    default: log.txt

outputs:
  ROCM_PATH:
    description: Absolute path of the ROCm installation root.
  version:
    description: The ROCm version that was installed.
  cache-hit:
    description: >-
      'true' if ROCm came from the Actions cache or from an install already
      on the runner, otherwise 'false'.

runs:
  using: node24
  main: dist/index.js
